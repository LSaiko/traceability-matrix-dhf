[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traceability-matrix-dhf"
version = "0.1.0"
description = "DHF traceability matrix for SaMD under 21 CFR 820.30, IEC 62304 and ISO 14971"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "reportlab==5.0.1",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.8",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["app", "schemas"]

[tool.setuptools.package-data]
schemas = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# fast in-memory suite by default; CI also runs `pytest -m integration` (SQLite)
addopts = "-m 'not integration'"
markers = ["integration: exercises the SQLite store on disk"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
